services:

  # ── 1. O.T.T.O RAG API ────────────────────────────────────────────────────
  rag-api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: otto_api
    ports:
      - "8001:8001"
    env_file:
      - .env
    environment:
      - QDRANT_HOST=qdrant_db
      - QDRANT_PORT=6333
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - rag_internal
    restart: unless-stopped

  # ── 2. Qdrant Vector Database ─────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6335:6333"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    networks:
      - rag_internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/6333"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── 3. Kafka Broker (KRaft — no Zookeeper) ────────────────────────────────
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka_broker
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka_broker:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka_broker:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qg
    networks:
      - rag_internal
    restart: unless-stopped

networks:
  rag_internal:
    driver: bridge

volumes: {}
